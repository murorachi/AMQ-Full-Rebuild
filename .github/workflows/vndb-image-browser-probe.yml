name: VNDB Character Image Browser Decode Probe

on:
  push:
    branches:
      - automation/vndb-native-import-20261114
    paths:
      - vndb-import/image-browser-probe-trigger.json

permissions:
  contents: read

jobs:
  chromium-decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sampled catalog URLs
        uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Load sample images using the same no-referrer policy as Collection UI
        shell: bash
        run: |
          python3 <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from playwright.async_api import async_playwright

          source = json.loads(Path("vndb-import/image-probe.json").read_text())
          urls = source["urls"]

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  await page.set_content("<!doctype html><html><body></body></html>")
                  results = []

                  async def check(url):
                      return await page.evaluate("""async (url) => {
                        return await new Promise(resolve => {
                          const image = document.createElement('img');
                          image.referrerPolicy = 'no-referrer';
                          image.decoding = 'async';
                          image.loading = 'eager';
                          const timeout = setTimeout(() => {
                            image.remove();
                            resolve({url, ok: false, error: 'decode-timeout'});
                          }, 15000);
                          image.onload = async () => {
                            clearTimeout(timeout);
                            try { await image.decode(); } catch (error) {
                              image.remove();
                              resolve({url, ok: false, error: 'decode: ' + error.message});
                              return;
                            }
                            const result = {
                              url,
                              ok: image.naturalWidth > 0 && image.naturalHeight > 0,
                              naturalWidth: image.naturalWidth,
                              naturalHeight: image.naturalHeight,
                              complete: image.complete,
                              referrerPolicy: image.referrerPolicy
                            };
                            image.remove();
                            resolve(result);
                          };
                          image.onerror = () => {
                            clearTimeout(timeout);
                            image.remove();
                            resolve({url, ok: false, error: 'image-load-error'});
                          };
                          image.src = url;
                          document.body.appendChild(image);
                        });
                      }""", url)

                  for start in range(0, len(urls), 6):
                      batch = urls[start:start + 6]
                      results.extend(await asyncio.gather(*(check(url) for url in batch)))

                  report = {
                    "generatedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
                    "source": "VNDB Official Dump 2026-11-14 catalog",
                    "catalogUniqueImages": source["catalogUniqueImages"],
                    "sampleCount": len(results),
                    "successCount": sum(1 for row in results if row.get("ok")),
                    "failureCount": sum(1 for row in results if not row.get("ok")),
                    "results": results
                  }
                  Path("vndb-import/image-browser-decode-results.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
                  print(json.dumps({k: report[k] for k in ("catalogUniqueImages", "sampleCount", "successCount", "failureCount")}, indent=2))
                  await browser.close()
                  if report["failureCount"]:
                      raise SystemExit(1)

          asyncio.run(main())
          PY

      - name: Upload browser image decode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vndb-character-image-browser-decode
          path: vndb-import/image-browser-decode-results.json
          if-no-files-found: warn
          retention-days: 7
